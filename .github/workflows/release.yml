name: Publish Skill Release
on:
  push:
    branches: [main]
    paths: [release-version.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skill-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and verify skill
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile
          version = Path("release-version.txt").read_text().strip()
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid version")
          root = Path("project-retrospective-card")
          assert (root / "SKILL.md").is_file()
          out = Path("dist")
          out.mkdir(exist_ok=True)
          archive = out / f"project-retrospective-card-{version}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc":
                      z.write(p, p.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert "project-retrospective-card/SKILL.md" in z.namelist()
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out / "SHA256SUMS.txt").write_text(f"{checksum}  {archive.name}\n")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          PY
      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## 项目复盘知识卡 Skill v1.3.1
          增加首次安装者必读的MinerU前置部署说明，现有本地一键处理流程保持可用。
          
          ### 本次补充
          - Windows PowerShell独立环境安装、macOS/Linux部署步骤。
          - 模型下载、verify和真实样本文档转换三项检查。
          - 完整Skill导入、脚本依赖及本地可执行文件路径配置。
          - WebUI/7860端口、缺少pip、下载失败、显存不足等常见问题。
          - 本地模型与远程服务配置边界、已有部署跳过重复安装。
          
          首次使用请先读references/MinerU前置部署.md，再按references/安装与使用.md导入技能。
          最终保留项目内容Markdown与项目知识卡Markdown两份文件，供人工确认及Obsidian阅读编辑。
          命令已参照官方文档核对，未在所有硬件环境逐一安装验证。附SHA256SUMS.txt。
          EOF
          gh release create "$VERSION" "dist/project-retrospective-card-$VERSION.zip" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "项目复盘知识卡 Skill $VERSION" --notes-file release-notes.md
