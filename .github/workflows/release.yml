name: Publish Skill Release
on:
  push:
    branches: [main]
    paths: [release-version.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skill-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and verify skill
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile
          version = Path("release-version.txt").read_text().strip()
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid version")
          root = Path("project-retrospective-card")
          assert (root / "SKILL.md").is_file()
          out = Path("dist")
          out.mkdir(exist_ok=True)
          archive = out / f"project-retrospective-card-{version}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc":
                      z.write(p, p.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert "project-retrospective-card/SKILL.md" in z.namelist()
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out / "SHA256SUMS.txt").write_text(f"{checksum}  {archive.name}\n")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          PY
      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## 项目复盘知识卡 Skill v1.3.0
          一次向Agent提供项目文件夹，自动完成扫描提醒、本地MinerU解析、全文合并、按规范写卡、核验清理，最终保留两份Markdown。
          
          ### 本次更新
          - 自动识别D:/MinerU/.venv/Scripts/mineru-kit.exe、配置路径或系统PATH。
          - 新增run_project.py统一入口，默认串行解析以适配单卡8GB显存。
          - 不依赖WebUI或7860端口，不要求在线Token，不自动改为在线上传。
          - Agent读取总Markdown生成知识卡并自动执行结构核验与临时文件清理。
          - 同名历史成果保留，最终提醒人工核对后归档。
          
          ### 安装与调用
          更新完整技能目录后，在WorkBuddy、豆包工作或Codex中说明项目文件夹及本地MinerU安装位置即可。
          详见README、references/安装与使用.md和references/本地一键执行.md。
          Python脚本完成解析合并；智能知识卡由Agent按规范撰写，不是脱离Agent双击脚本自动调用LLM。
          
          ### 验证边界
          通过统一入口和模拟可执行文件测试；未直接访问使用者Windows D盘实机验收。附SHA256SUMS.txt。
          EOF
          gh release create "$VERSION" "dist/project-retrospective-card-$VERSION.zip" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "项目复盘知识卡 Skill $VERSION" --notes-file release-notes.md
